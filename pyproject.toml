[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-tutoring"
version = "0.1.0"
description = "RAG over deep learning tutoring materials, with answers cited to source passages"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    # Chunking sizes windows in word-pieces, so it loads the model's tokenizer
    # (vocabulary only, no weights) directly rather than via sentence-transformers.
    "transformers>=4.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Generation. A hard dependency even though generation is optional at runtime:
    # `generate.py` imports it lazily, so the tests and a key-less run never touch it,
    # and an optional extra would add a step that silently yields a deployment serving
    # passages with no answer and no error explaining why.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ruff>=0.6",
    "pytest>=8.0",
    # Required by fastapi.testclient. Chroma already pulls it in transitively;
    # pinned here so the test suite does not depend on that staying true.
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

# The frontend is packaged data, not a source file that happens to sit nearby.
# setuptools' `include-package-data` default already puts it in the wheel -- checked,
# it ships with this section removed -- so this is a pin rather than the mechanism:
# it states the dependency instead of inheriting it from a default that has changed
# before and that a later MANIFEST.in could narrow. The failure it pins against is
# silent and one-sided: an editable install resolves the page off the filesystem and
# the whole suite passes, while a wheel missing it only fails at `GET /` in the
# container. `unzip -l` on the built wheel is the check that actually covers that.
[tool.setuptools.package-data]
rag_tutoring = ["static/*.html"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
