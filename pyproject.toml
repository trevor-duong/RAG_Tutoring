[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-tutoring"
version = "0.1.0"
description = "RAG over deep learning tutoring materials, with answers cited to source passages"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    # Chunking sizes windows in word-pieces, so it loads the model's tokenizer
    # (vocabulary only, no weights) directly rather than via sentence-transformers.
    "transformers>=4.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0",
    "ruff>=0.6",
    "pytest>=8.0",
    # Required by fastapi.testclient. Chroma already pulls it in transitively;
    # pinned here so the test suite does not depend on that staying true.
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
